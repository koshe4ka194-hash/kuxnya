<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Кухня волшебных рецептов — нейроквест</title>
<style>
:root{color-scheme:light;--ink:#60416a;--purple:#8e5b99;--edge:rgba(117,79,128,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent!important;font-family:'Trebuchet MS',Verdana,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.47;cursor:default}button:focus-visible{outline:3px solid #637bc1;outline-offset:3px}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(5px,1.1vw,12px);background:transparent}
.game{width:min(1060px,100%);border-radius:26px;border:1px solid rgba(255,255,255,.75);background:rgba(223,222,229,.73);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);box-shadow:0 12px 42px rgba(59,38,71,.2);padding:clamp(11px,1.7vw,21px);display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(18px,2.4vw,26px);color:#85538e}.sub{font-size:12px;font-weight:700;color:#846b8d}.pill{border-radius:22px;padding:8px 12px;background:rgba(255,255,255,.68);font-weight:800;font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tab{border:1px solid var(--edge);border-radius:14px;background:rgba(255,255,255,.72);padding:10px 5px;font-size:clamp(11px,1.3vw,15px);font-weight:800;color:#84618c}.tab.active{background:#f4cfe7;color:#6e417d}.tab.done{box-shadow:inset 0 -4px #83c69f}
.levels,.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px}.lv{background:rgba(255,255,255,.78);border:1px solid var(--edge);border-radius:20px;padding:7px 16px;color:#86618e;font-weight:800}.lv.active{background:#be91d7;color:white}.lv.done{border-color:#6cab8c}
.stage{border-radius:20px;background:rgba(251,251,252,.73);border:1px solid rgba(255,255,255,.75);padding:clamp(10px,2vw,21px);min-height:290px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px}
h1{font-size:clamp(21px,2.8vw,30px);margin:0;line-height:1.15;color:#805087}p{font-size:clamp(13px,1.5vw,17px);margin:0;line-height:1.4;max-width:770px}.tip{color:#8b708f;font-size:12px!important}.btn{border:0;border-radius:22px;padding:11px 18px;font-weight:900;color:white;background:linear-gradient(115deg,#e58cba,#ab8bd9);box-shadow:0 4px 0 #9267aa;min-height:43px}.btn.secondary{background:rgba(255,255,255,.86);border:1px solid #d9bddf;color:#82558c;box-shadow:none}.btn:active:not(:disabled){transform:translateY(2px)}
.cards{width:100%;display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:9px}.ingredient{position:relative;width:clamp(94px,13vw,145px);min-height:clamp(102px,14.5vw,155px);border:1.5px solid #dfc5e4;border-radius:17px;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;transition:transform .12s,border-color .12s}.ingredient img{width:100%;height:clamp(64px,9vw,105px);object-fit:contain;display:block}.ingredient span{font-size:clamp(11px,1.15vw,14px);font-weight:800;color:#6f5278}.ingredient:not(:disabled):active{transform:scale(.96)}.ingredient.selected{border-color:#b886cc;background:#efdaf8}.ingredient.preview{cursor:default;background:#fff5fa;opacity:1!important}
.order{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:43px}.slot{min-width:58px;min-height:43px;border:2px dashed #bf9dcc;border-radius:13px;display:flex;justify-content:center;align-items:center;padding:6px 9px;background:rgba(255,255,255,.55);font-size:12px;font-weight:800;color:#7e5685}.slot.filled{background:#ead7f5;border-style:solid}
.actions-card{width:clamp(130px,19vw,205px);min-height:83px;border:1.5px solid #dab8df;border-radius:15px;background:rgba(255,255,255,.86);padding:9px;display:flex;align-items:center;gap:9px;text-align:left}.actions-card img{width:52px;height:60px;object-fit:contain}.actions-card span{font-size:clamp(11px,1.3vw,14px);font-weight:800;color:#6b4e76}.actions-card.selected{background:#e8d1ef}
.timer{height:8px;width:min(410px,85%);background:#e6d7eb;border-radius:12px;overflow:hidden}.timer>div{height:100%;background:linear-gradient(90deg,#ed98b8,#ad86d8);width:100%;transition:width .1s linear}
.blank{font-weight:900;color:#995da0;font-size:clamp(21px,3vw,32px);border:2px dashed #c499d5;background:#f9effa;border-radius:16px;min-width:112px;padding:20px}
.feedback{min-height:25px;text-align:center;font-weight:900;font-size:clamp(13px,1.5vw,17px);color:#a54f75}.feedback.good{color:#3f916b}.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:800;color:#886b90}.dots{letter-spacing:2px;font-size:18px}
@media(max-width:640px){#root{align-items:flex-start;padding:4px}.game{border-radius:18px;padding:9px;gap:8px}.ingredient{width:clamp(78px,22vw,120px);min-height:100px;padding:5px}.ingredient img{height:68px}.actions-card{width:clamp(130px,44vw,190px)}.stage{gap:8px}.foot{justify-content:center}.tab{padding:8px 3px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function clear(){stopTimer();selected=[];feedback.textContent='';feedback.className='feedback';stage.replaceChildren()}
function say(txt,good=false){feedback.textContent=txt;feedback.className='feedback'+(good?' good':'')}
function header(title,txt){stage.append($('h1','',title),$('p','',txt))}
function actions(...b){const r=$('div','actions');r.append(...b);stage.append(r);return r}
function renderNav(){for(let i=0;i<3;i++){let el=document.getElementById('t'+i);el.className='tab'+(i===task?' active':Array.from(done).filter(x=>x.startsWith(i+':')).length===3?' done':'')};document.querySelectorAll('.lv').forEach((el,i)=>el.className='lv'+(task>=0&&level===i?' active':task>=0&&done.has(task+':'+i)?' done':''));document.getElementById('location').textContent=task<0?'Выберите задание':`Задание ${task+1} · Уровень ${level+1}`;document.getElementById('counter').textContent=`Пройдено ${done.size} из 9 испытаний`;document.getElementById('dots').textContent=Array.from({length:9},(_,i)=>done.has(Math.floor(i/3)+':'+(i%3))?'🌸':'♡').join(' ')}
function itemCard(id,onClick,preview=false){let b=$('button','ingredient'+(preview?' preview':''));b.type='button';let img=$('img');img.src=ASSETS[id].src;img.alt='';b.append(img,$('span','',ASSETS[id].name));if(preview){b.setAttribute("aria-disabled","true");b.tabIndex=-1;}else if(onClick)b.addEventListener('click',onClick);return b}
function actionCard(s,fn,preview=false){const b=$('button','actions-card'+(preview?' preview':''));b.type='button';const img=$('img');img.src=ASSETS[s.id].src;img.alt='';b.append(img,$('span','',s.txt));if(preview)b.disabled=true;else b.addEventListener('click',fn);return b}
function home(){task=-1;phase='home';clear();stage.append($('div','', '🧁 ✨ 💗'));header('Волшебная кухня','Помоги приготовить праздничное угощение для мамы! Выбирай любое задание и любой уровень сложности.');stage.append($('p','tip','Внимательно запоминай картинки или действия. После их исчезновения восстанови рецепт.'));actions(btn('1. Запомни рецепт',()=>choose(0,0)),btn('2. Чего не хватает?',()=>choose(1,0)),btn('3. Секретный рецепт',()=>choose(2,0)));renderNav()}
function choose(t,l){task=t;level=l;phase='ready';clear();let counts=task===0?[3,4,5]:task===1?[4,5,6]:[3,4,5];header(taskNames[task],task===0?'Запомни порядок ингредиентов, затем собери его из карточек.':task===1?'Запомни все ингредиенты. Один пропадёт — найди его среди вариантов.':'Запомни, в каком порядке нужно выполнять действия, затем восстанови рецепт.');stage.append($('p','tip',`Уровень ${level+1} · ${counts[level]} элемента(ов). Время запоминания не ограничено.`));actions(btn('Начать!',()=>start(false)),btn('Выбрать другое задание',home,true));renderNav()}
function start(replay=false){
 replay = (replay === true);
 clear();phase='preview';
 if(!replay){attempt=0;initial=task===2?recipeSteps[level].map((_,i)=>i):[...sequences[task][level]];if(task===1)missing=initial[Math.floor(initial.length/2)]}
 header('Запоминай внимательно 👀',task===2?'Рассмотри последовательность действий и запомни её.':'Рассмотри все ингредиенты и запомни их порядок.');
 const area=$('div','cards');area.setAttribute('aria-label','Ингредиенты для запоминания');stage.append(area);
 if(task===2)recipeSteps[level].forEach(s=>area.append(actionCard(s,null,true)));
 else initial.forEach(s=>area.append(itemCard(s,null,true)));
 stage.append($('p','tip','Карточки останутся на экране, пока вы не нажмёте «Я запомнил(а)».'));
 actions(btn('Я запомнил(а) →',answer),btn('Посмотреть заново',()=>start(true),true));
}
function answer(){clear();phase='answer';selected=[];if(task===0)answerOrder();else if(task===1)answerMissing();else answerSteps()}
function slots(count){const row=$('div','order');for(let i=0;i<count;i++)row.append($('div','slot','?'));stage.append(row);return row}
function answerOrder(){const target=initial;header('Собери рецепт','Выбирай ингредиенты в том порядке, в котором они были показаны.');const r=slots(target.length),area=$('div','cards');stage.append(area);let options=shuffle([...target,...distractors[level].filter(x=>!target.includes(x))]);options.forEach(id=>area.append(itemCard(id,()=>pick(id))));const reset=btn('↶ Отменить',()=>{selected.pop();paint()},true),check=btn('Проверить ✓',verify);const a=actions(reset,check,btn('Посмотреть снова',()=>start(true),true));function pick(id){if(selected.includes(id)||selected.length>=target.length)return;selected.push(id);paint();say('')}function paint(){[...r.children].forEach((el,i)=>{el.textContent=selected[i]?ASSETS[selected[i]].name:'?';el.className='slot'+(selected[i]?' filled':'')});[...area.children].forEach((b,i)=>{b.disabled=selected.includes(options[i]);b.classList.toggle('selected',selected.includes(options[i]))});check.disabled=selected.length!==target.length}function verify(){if(selected.length<target.length)return;if(selected.every((id,i)=>id===target[i]))success();else{attempt++;say('Последовательность пока не совпадает. Попробуй снова! 💗');selected=[];paint()}}paint()}
function answerMissing(){header('Какого ингредиента не хватает?','Один продукт исчез. Выбери его среди карточек.');const r=$('div','cards');initial.filter(x=>x!==missing).forEach(id=>r.append(itemCard(id,null,true)));r.append($('div','blank','?'));stage.append(r);const variants=shuffle([missing,...distractors[level].filter(x=>x!==missing).slice(0,2)]);const choices=$('div','cards');stage.append(choices);variants.forEach(id=>choices.append(itemCard(id,()=>{if(phase!=='answer')return;if(id===missing){success()}else{attempt++;say('Такой ингредиент не пропадал. Посмотри внимательнее. 🌷')}})));actions(btn('Посмотреть снова',()=>start(true),true))}
function answerSteps(){const original=recipeSteps[level];header('Секретный рецепт','Вспомни последовательность действий. Нажимай на карточки по порядку.');const r=slots(original.length),area=$('div','cards');stage.append(area);const order=shuffle(original.map((_,i)=>i));order.forEach(i=>area.append(actionCard(original[i],()=>pick(i))));const check=btn('Проверить ✓',verify);actions(btn('↶ Отменить',()=>{selected.pop();paint()},true),check,btn('Посмотреть снова',()=>start(true),true));function pick(i){if(selected.includes(i)||selected.length>=original.length)return;selected.push(i);paint();say('')}function paint(){[...r.children].forEach((el,i)=>{el.textContent=selected[i]!==undefined?original[selected[i]].txt:'?';el.className='slot'+(selected[i]!==undefined?' filled':'')});[...area.children].forEach((b,idx)=>{b.disabled=selected.includes(order[idx]);b.classList.toggle('selected',selected.includes(order[idx]))});check.disabled=selected.length!==original.length}function verify(){if(selected.every((v,i)=>v===i)){success()}else{attempt++;say('Попробуй восстановить порядок действий ещё раз! 💗');selected=[];paint()}}paint()}
function success(){clear();phase='success';done.add(task+':'+level);stage.append($('div','', '🌷 ✨ 🧁'));header('Получилось!','Ты помог(ла) приготовить часть волшебного угощения!');stage.append($('p','tip',`Ошибок до правильного ответа: ${attempt}.`));say('Верно! Лепесток доброты становится ярче! 🌸',true);actions(btn('Следующий уровень',()=>choose(task,(level+1)%3)),btn('Другое задание',home,true),btn('Получить лепесток',finish,true));renderNav()}
function finish(){clear();phase='finish';stage.append($('div','', '🌸💗✨'));header('Лепесток доброты!','Фея Мила благодарит тебя за помощь на волшебной кухне!');stage.append($('p','tip',`Пройдено уровней: ${done.size} из 9. Можно выбрать ещё одно испытание.`));actions(btn('Выбрать задание',home));renderNav()}
for(let i=0;i<3;i++)document.getElementById('t'+i).addEventListener('click',()=>choose(i,0));document.querySelectorAll('.lv').forEach((b,i)=>b.addEventListener('click',()=>choose(task<0?0:task,i)));document.getElementById('home').addEventListener('click',home);home();
})();
</script></body></html>
